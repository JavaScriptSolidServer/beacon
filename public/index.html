<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--OGP-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FBFAF8">
<style>
  :root{
    --bg:#FBFAF8; --surface:#fff; --ink:#1a1a23; --muted:#65656f; --faint:#9a9aa6;
    --line:#ECEAE3; --accent:#6d5efc; --accent2:#22b8cf; --accent-soft:#efecff;
    --serif:'Newsreader',Georgia,serif; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent-soft)}
  a{color:inherit;text-decoration:none}
  main{max-width:1040px;margin:0 auto;padding:0 1.2rem 5rem}

  /* hero */
  .hero{position:relative;text-align:center;padding:5rem 1rem 3rem;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:-40% 0 auto;height:420px;z-index:0;
    background:radial-gradient(40% 60% at 30% 20%,rgba(109,94,252,.22),transparent 70%),
               radial-gradient(45% 55% at 75% 30%,rgba(34,184,207,.18),transparent 70%);
    filter:blur(8px)}
  .hero>*{position:relative;z-index:1}
  .mark{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:-.01em;font-size:.95rem;color:var(--muted)}
  .dot{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent));box-shadow:0 0 18px 2px rgba(109,94,252,.55)}
  h1{font-family:var(--serif);font-size:clamp(2.6rem,6vw,4rem);font-weight:600;letter-spacing:-.02em;line-height:1.04;margin:1.2rem 0 .6rem}
  .hero p{color:var(--muted);font-size:1.12rem;max-width:30rem;margin:0 auto}
  .hero .stat{margin-top:1.4rem;font-family:var(--mono);font-size:.8rem;color:var(--faint)}

  /* grid of profiles */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-top:1rem}
  .card{display:block;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s;box-shadow:0 1px 2px rgba(20,20,30,.04)}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(80,70,160,.13);border-color:#dcd8f5}
  .av{position:relative;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;
    font-weight:700;color:var(--accent);font-size:1.3rem;overflow:hidden}
  .av img,.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card .name{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin:.7rem 0 .1rem;line-height:1.2}
  .card .nip05{color:var(--accent);font-size:.82rem;font-weight:500}
  .card .about{color:var(--muted);font-size:.9rem;margin-top:.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .did{font-family:var(--mono);font-size:.7rem;color:var(--faint);margin-top:.7rem}

  /* detail */
  .detail{padding-top:2rem}
  .back{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.88rem;font-weight:500;margin-bottom:1.6rem;cursor:pointer}
  .back:hover{color:var(--accent)}
  .phead{display:flex;gap:1.3rem;align-items:flex-start}
  .phead .av{width:88px;height:88px;font-size:2rem;flex:none}
  .phead h2{font-family:var(--serif);font-size:2.1rem;font-weight:600;line-height:1.1}
  .phead .nip05{color:var(--accent);font-weight:500}
  .phead .about{color:var(--muted);margin-top:.5rem;max-width:42rem}
  .chips{margin-top:.7rem;display:flex;gap:.5rem;flex-wrap:wrap}
  .chip{font-size:.78rem;font-weight:500;background:var(--accent-soft);color:var(--accent);padding:.25rem .7rem;border-radius:999px}
  .didline{display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.8rem;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;margin-top:1rem;word-break:break-all;transition:border-color .15s,color .15s}
  .didline:hover{border-color:var(--accent);color:var(--accent)}
  .didline .resolve{margin-left:auto;color:var(--accent);font-weight:600;white-space:nowrap}
  .sections{display:grid;grid-template-columns:1fr;gap:1.4rem;margin-top:2rem}
  @media(min-width:760px){.sections{grid-template-columns:1.1fr 1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem;box-shadow:0 1px 2px rgba(20,20,30,.04)}
  .panel h3{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:.9rem}
  .follows{display:flex;flex-wrap:wrap;gap:.5rem}
  .follows .fav{position:relative;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);overflow:hidden;transition:transform .12s}
  .follows .fav:hover{transform:scale(1.2);z-index:1}
  pre{font-family:var(--mono);font-size:.74rem;line-height:1.55;color:#2a2a35;white-space:pre-wrap;word-break:break-word;max-height:460px;overflow:auto}
  .k{color:var(--accent)} .s{color:#1c8c6b}
  footer{text-align:center;color:var(--faint);font-size:.8rem;margin-top:3rem}
  footer a{color:var(--accent)}
  .loading{text-align:center;color:var(--faint);padding:3rem;font-size:.9rem}

  /* search */
  .searchwrap{margin:1.9rem auto .2rem;max-width:31rem}
  .searchwrap input{width:100%;font-family:var(--sans);font-size:1rem;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:999px;padding:.82rem 1.25rem;outline:none;
    box-shadow:0 1px 2px rgba(20,20,30,.04);transition:border-color .15s,box-shadow .15s}
  .searchwrap input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .searchwrap input::placeholder{color:var(--faint)}
  .hero .stat strong{color:var(--muted);font-weight:700}
  /* counts + section label */
  .card .counts{font-size:.8rem;color:var(--muted);margin-top:.5rem}
  .card .counts strong{color:var(--ink);font-weight:600}
  .seclabel{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:.4rem 0 1rem}
  .chip strong{font-weight:700}

  /* topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:1040px;margin:0 auto;padding:1.1rem 1.2rem 0}
  .tb-brand{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:-.01em;color:var(--muted);font-size:.95rem}
  .tb-nav{display:flex;align-items:center;gap:1.1rem}
  .tb-nav>a{font-size:.88rem;font-weight:500;color:var(--muted)}
  .tb-nav>a:hover{color:var(--accent)}
  .tb-cta{background:var(--accent);color:#fff!important;padding:.5rem .9rem;border-radius:999px;font-weight:600;box-shadow:0 4px 14px rgba(109,94,252,.3);transition:transform .15s,box-shadow .15s}
  .tb-cta:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(109,94,252,.4)}
  @media(max-width:560px){.tb-nav>a:not(.tb-cta){display:none}}
  /* link page */
  .link-panel{max-width:620px;margin:0 auto}
  .link-panel h2{font-family:var(--serif);font-size:1.8rem;font-weight:600;margin-bottom:.6rem}
  .link-panel p{color:var(--muted);margin-bottom:.4rem}
  .link-form{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
  .link-form input{flex:1;min-width:240px;font-family:var(--mono);font-size:.85rem;border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;outline:none}
  .link-form input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .cta{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:.7rem 1.2rem;font-weight:600;font-size:.9rem;cursor:pointer;font-family:var(--sans)}
  .cta:disabled{opacity:.55;cursor:default}
  .link-status{width:100%;font-size:.88rem;color:var(--muted);margin-top:.5rem;line-height:1.5}
  .link-status.ok{color:#1c8c6b} .link-status.err{color:#c0392b}
</style>
</head>
<body>
<header class="topbar">
  <a class="tb-brand" href="/"><span class="dot"></span> nostr.social</a>
  <nav class="tb-nav">
    <a href="/link">Link your pod</a>
  </nav>
</header>
<main>
  <div class="hero">
    <h1>A directory of <em style="font-style:italic">did:nostr</em> identities</h1>
    <p>Profiles, the follow graph, and a verifiable DID document for every key &mdash; indexed live from Nostr.</p>
    <div class="searchwrap"><input id="q" type="search" placeholder="Search by name, nip05, npub, or hex pubkey…" autocomplete="off" spellcheck="false"></div>
    <div class="stat" id="stat"></div>
  </div>
  <div id="view"></div>
  <footer>powered by <a href="https://github.com/JavaScriptSolidServer/beacon">beacon</a> · each profile resolves at <code>/.well-known/did/nostr/&lt;pubkey&gt;.json</code></footer>
</main>

<!-- xlogin: universal Nostr/Solid login widget — extension-free (guest key / paste / extension) -->
<script src="https://unpkg.com/xlogin@0.0.15"></script>
<script type="module">
const $ = (s) => document.querySelector(s);
const view = $('#view');
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const short = (pk) => pk ? pk.slice(0, 8) + '…' + pk.slice(-4) : '';
const content = (p) => { try { return JSON.parse(p.content || '{}'); } catch { return {}; } };
const initial = (c, pk) => (c.name || c.display_name || pk || '?').trim()[0]?.toUpperCase() || '?';

function hueFrom(s = '') { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function gradStyle(seed) { const a = hueFrom(seed), b = (a + 38) % 360; return `background:linear-gradient(135deg,hsl(${a} 68% 70%),hsl(${b} 72% 55%));color:#fff`; }
function avatar(c, pk, cls = 'av') {
  const img = c.picture ? `<img src="${esc(c.picture)}" alt="" onerror="this.style.display='none'">` : '';
  return `<div class="${cls}" style="${gradStyle(pk)}">${esc(initial(c, pk))}${img}</div>`;
}

function highlight(obj) {
  return esc(JSON.stringify(obj, null, 2))
    .replace(/&quot;(@?\w+)&quot;:/g, '<span class="k">&quot;$1&quot;</span>:')
    .replace(/: (&quot;[^&]*?&quot;)/g, ': <span class="s">$1</span>');
}

const fmt = (n) => {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k';
  return String(n);
};

function cardHtml(p) {
  const c = content(p);
  const ct = p._counts || {};
  return `<a class="card" href="/${p.pubkey}" data-pk="${p.pubkey}">
    ${avatar(c, p.pubkey)}
    <div class="name">${esc(c.name || c.display_name || short(p.pubkey))}</div>
    ${c.nip05 ? `<div class="nip05">${esc(c.nip05)}</div>` : ''}
    <div class="counts"><strong>${fmt(ct.followers)}</strong> followers · <strong>${fmt(ct.following)}</strong> following</div>
    ${c.about ? `<div class="about">${esc(c.about)}</div>` : ''}
    <div class="did">did:nostr:${short(p.pubkey)}</div>
  </a>`;
}

function renderGrid(profiles, label) {
  view.innerHTML = `${label ? `<div class="seclabel">${label}</div>` : ''}<div class="grid">${profiles.map(cardHtml).join('')}</div>`;
}

async function loadStats() {
  const s = await fetch('/api/stats').then((r) => r.json()).catch(() => null);
  if (s) $('#stat').innerHTML = `<strong>${fmt(s.profiles)}</strong> identities · <strong>${fmt(s.follows)}</strong> follow lists · <strong>${fmt(s.relays)}</strong> relays`;
}

async function home() {
  if ($('#q')) $('#q').value = '';
  view.innerHTML = '<div class="loading">loading identities…</div>';
  const profiles = await fetch('/api/profiles?limit=36').then((r) => r.json()).catch(() => []);
  if (!profiles.length) { view.innerHTML = '<div class="loading">No profiles indexed yet. Start the indexer and refresh.</div>'; return; }
  renderGrid(profiles, 'Recently active');
}

async function searchView(q) {
  view.innerHTML = '<div class="loading">searching…</div>';
  const results = await fetch(`/api/search?q=${encodeURIComponent(q)}`).then((r) => r.json()).catch(() => []);
  if (!Array.isArray(results) || !results.length) { view.innerHTML = `<div class="loading">No matches for &ldquo;${esc(q)}&rdquo;.</div>`; return; }
  renderGrid(results, `${results.length} result${results.length > 1 ? 's' : ''} for &ldquo;${esc(q)}&rdquo;`);
}

// strip our UI-only count fields so the displayed JSON is the pure DID document
const didOnly = ({ followersCount, followingCount, ...d }) => d;

async function profile(pk) {
  view.innerHTML = '<div class="loading">resolving DID document…</div>';
  const doc = await fetch(`/api/did/${pk}`).then((r) => r.json()).catch(() => null);
  if (!doc || doc.error) { view.innerHTML = '<div class="loading">Could not resolve this identity.</div>'; return; }
  const c = doc.profile || {};
  const follows = doc.follows || [];
  const followers = doc.followersCount, following = doc.followingCount ?? follows.length;
  view.innerHTML = `<div class="detail">
    <div class="back" id="back">← all identities</div>
    <div class="phead">
      ${avatar(c, pk)}
      <div>
        <h2>${esc(c.name || short(pk))}</h2>
        ${c.nip05 ? `<div class="nip05">${esc(c.nip05)}</div>` : ''}
        ${c.about ? `<div class="about">${esc(c.about)}</div>` : ''}
        <div class="chips">
          <span class="chip"><strong>${fmt(followers)}</strong> followers</span>
          <span class="chip"><strong>${fmt(following)}</strong> following</span>
          <a class="chip" href="https://nostr.at/p/${pk}" target="_blank" rel="noopener" title="View this identity on the nostr.at aggregator">nostr.at ↗</a>
          ${doc.service?.length ? `<span class="chip">${doc.service.length} relay${doc.service.length > 1 ? 's' : ''}</span>` : ''}
          ${c.website ? `<a class="chip" href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\//, ''))}</a>` : ''}
          ${c.lud16 ? `<span class="chip">⚡ ${esc(c.lud16)}</span>` : ''}
        </div>
      </div>
    </div>
    <a class="didline" href="/.well-known/did/nostr/${pk}.json" target="_blank" rel="noopener" title="Resolve the DID document (application/did+json)"><span>${esc(doc.id)}</span><span class="resolve">resolve ↗</span></a>
    <div class="sections">
      <div class="panel"><h3>DID document</h3><pre>${highlight(didOnly(doc))}</pre></div>
      <div class="panel"><h3>Following · ${follows.length}</h3>
        ${follows.length ? `<div class="follows">${follows.slice(0, 96).map((d) => { const fk = d.replace('did:nostr:', ''); return `<a class="fav" data-pk="${fk}" style="${gradStyle(fk)}" title="${esc(fk)}" href="/${fk}"></a>`; }).join('')}</div>`
          : '<div style="color:var(--faint);font-size:.9rem">No follow list indexed.</div>'}
      </div>
    </div>
  </div>`;
  $('#back').onclick = () => navigate('/');
}

// ---- link your pod (onboarding) ----
const RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net'];

function publishEvent(event) {
  return Promise.all(RELAYS.map((url) => new Promise((resolve) => {
    let ws, done = false;
    const finish = (ok) => { if (!done) { done = true; try { ws.close(); } catch {} resolve({ url, ok }); } };
    try { ws = new WebSocket(url); } catch { return finish(false); }
    ws.onopen = () => ws.send(JSON.stringify(['EVENT', event]));
    ws.onmessage = (m) => { try { const d = JSON.parse(m.data); if (d[0] === 'OK' && d[1] === event.id) finish(!!d[2]); } catch {} };
    ws.onerror = () => finish(false);
    setTimeout(() => finish(false), 6000);
  })));
}

const linkForm = (val) => `<div class="link-form">
  <input id="webid" type="url" placeholder="https://you.solid.social/profile/card#me" value="${esc(val)}">
  <button id="dolink" class="cta">Publish link</button>
  <div id="linkstatus" class="link-status"></div>
</div>`;

function panelLink(inner) {
  view.innerHTML = `<div class="detail"><div class="back" id="back">← all identities</div><div class="panel link-panel">${inner}</div></div>`;
  $('#back').onclick = () => navigate('/');
}

function linkView() {
  if ($('#q')) $('#q').value = '';
  $('#stat').innerHTML = '';
  panelLink(`<h2>Link your pod</h2>
    <p>Linking your nostr key to a Solid pod lets <strong>did:nostr</strong> resolve to your WebID — so one-click sign-in works. No browser extension needed.</p>
    <div class="link-form" style="margin-top:1.1rem"><button id="link-start" class="cta">Sign in to continue</button><div id="linkstatus" class="link-status"></div></div>`);
  const b = $('#link-start'); if (b) b.onclick = startLink;
}

async function startLink() {
  const status = $('#linkstatus');
  const say = (m, k = '') => { if (status) { status.textContent = m; status.className = 'link-status' + (k ? ' ' + k : ''); } };
  if (!window.nostr) return say('Login widget still loading — try again in a moment.', 'err');
  say('Opening sign-in…');
  let pubkey;
  try { pubkey = (await window.nostr.getPublicKey()).toLowerCase(); }
  catch { return say('Sign-in cancelled — click to try again.', 'err'); }
  say('Resolving your did:nostr…');
  const doc = await fetch(`/api/did/${pubkey}`).then((r) => r.json()).catch(() => null);
  const aka = (doc?.alsoKnownAs || []).find((x) => /^https?:\/\//.test(x));
  if (aka) {
    panelLink(`<h2>You're linked ✓</h2>
      <p><code>did:nostr:${short(pubkey)}</code> resolves to your WebID:</p>
      <div class="didline"><span>${esc(aka)}</span></div>
      <p style="margin-top:1rem;color:var(--muted)">Apps can now resolve you to your pod.</p>
      <details style="margin-top:1.1rem"><summary style="cursor:pointer;color:var(--muted)">Change linked pod</summary>${linkForm(aka)}</details>`);
  } else {
    panelLink(`<h2>Link your pod</h2>
      <p><code>did:nostr:${short(pubkey)}</code> isn't linked to a Solid pod yet. Enter your WebID (your pod's profile URL) and we'll publish an <code>alsoKnownAs</code> to your nostr profile (kind&nbsp;0), signed by your key.</p>
      ${linkForm('')}`);
  }
  wireLink(pubkey);
}

function wireLink(pubkey) {
  const btn = $('#dolink'); if (!btn) return;
  const status = $('#linkstatus');
  const say = (msg, kind = '') => { status.textContent = msg; status.className = 'link-status' + (kind ? ' ' + kind : ''); };
  btn.onclick = async () => {
    const webid = $('#webid').value.trim();
    if (!/^https?:\/\/.+/.test(webid)) return say('Enter a valid WebID URL (https://…).', 'err');
    btn.disabled = true; say('Building your updated profile…');
    try {
      const raw = await fetch(`/api/profile/${pubkey}`).then((r) => r.json()).catch(() => null);
      let c = {}; try { c = JSON.parse(raw?.content || '{}'); } catch {}
      c.alsoKnownAs = [webid];
      const unsigned = { kind: 0, pubkey, created_at: Math.floor(Date.now() / 1000), tags: [], content: JSON.stringify(c) };
      say('Requesting your signature…');
      const signed = await window.nostr.signEvent(unsigned);
      say('Publishing to relays…');
      const results = await publishEvent(signed);
      const ok = results.filter((r) => r.ok).length;
      if (ok) say(`Published to ${ok}/${results.length} relays. did:nostr:${short(pubkey)} now points to ${webid}. beacon will re-index shortly, then Sign in with did:nostr works.`, 'ok');
      else say('No relay accepted the event — try again or check your relays.', 'err');
    } catch (err) { say('Signing/publishing failed: ' + (err?.message || err), 'err'); }
    finally { btn.disabled = false; }
  };
}

function navigate(path) { if (location.pathname !== path) history.pushState({}, '', path); route(); }

let searchTimer;
function onSearch() {
  const q = $('#q').value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { if (!q) (location.pathname === '/' ? home() : navigate('/')); else searchView(q); }, 220);
}

function route() {
  if (location.pathname === '/link') return linkView();
  const m = location.pathname.match(/^\/([0-9a-f]{64})$/i);
  if (m) return profile(m[1].toLowerCase());
  const h = location.hash.slice(1);                 // legacy #<hex> links still resolve
  if (/^[0-9a-f]{64}$/.test(h)) return profile(h);
  return home();
}

// delegated SPA nav for any [data-pk] link (cards, follow dots)
document.addEventListener('click', (e) => {
  const el = e.target.closest('a[data-pk]');
  if (!el || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  navigate('/' + el.dataset.pk);
});
$('#q').addEventListener('input', onSearch);
window.addEventListener('popstate', route);
loadStats();
route();
</script>
</body>
</html>
